name: Hybrid Genetics Build Check
on:
  push:
    branches:
      - hybrid-genetics-final

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore SpaceStation14.slnx
      - name: Build shared
        run: dotnet build Content.Shared/Content.Shared.csproj --no-restore -v:minimal
      - name: Build server
        run: dotnet build Content.Server/Content.Server.csproj --no-restore -v:minimal
      - name: Build client
        run: dotnet build Content.Client/Content.Client.csproj --no-restore -v:minimal
