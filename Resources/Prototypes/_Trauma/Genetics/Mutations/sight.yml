- type: entity
  parent: BaseMutation
  id: MutationNearSightedness
  name: Near Sightedness
  description: The holder of this mutation has poor eyesight.
  components:
  - type: Mutation
    instability: -30
    conflicts:
    - MutationBlindness
  - type: ComponentMutation
    added:
    - type: PermanentBlindness
      blindness: 4

- type: entity
  parent: BaseMutation
  id: MutationBlindness
  name: Blindness
  description: Renders the subject completely blind.
  components:
  - type: Mutation
    instability: -40
  - type: RemovesMutation
    removes:
    - MutationNearSightedness
  - type: ComponentMutation
    added:
    - type: PermanentBlindness

- type: entity
  parent: BaseMutation
  id: MutationThermalVision
  name: Thermal Vision
  description: The user of this genome can visually perceive the unique human thermal signature.
  components:
  - type: Mutation
    canonicalKey: thermal-vision
    instability: 35
    difficulty: 18
    rarity: Mythical
  - type: ComponentMutation
    added:
    - type: ThermalVision
      toggleAction: MutationActionThermalVision
      pulseTime: 10

- type: entity
  parent: ToggleThermalVision
  id: MutationActionThermalVision
  components:
  - type: Action
    useDelay: 25
  - type: EffectAction
    onPerformed: true
    effects:
    - !type:EyeDamage
      amount: 1
      probability: 0.2

- type: entity
  parent: BaseMutation
  id: MutationIlliterate
  name: Illiterate
  description: Causes a severe case of Aphasia that prevents reading or writing.
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: BlockReading
    - type: BlockWriting

- type: entity
  parent: BaseMutationAdmeme
  id: MutationLaserEyes
  name: Laser Eyes
  description: Reflects concentrated light back from the eyes.
  components:
  - type: Mutation
    difficulty: 16
    rarity: Mythical

- type: entity
  parent: BaseMutation
  id: MutationEnhancedPerception
  name: Enhanced Perception
  description: Improves the subject's peripheral vision, letting them see things in the corner of their eyes better.
  components:
  - type: Mutation
    instability: 20
    difficulty: 14
    rarity: Rare
    conflicts:
    - MutationBlindness
    - MutationWeakPerception

- type: entity
  parent: BaseMutation
  id: MutationWeakPerception
  name: Weak Perception
  description: The subject has almost no peripheral vision, only able to see almost directly infront of themselves.
  components:
  - type: Mutation
    instability: -20
    difficulty: 14
    rarity: Rare
    conflicts:
    - MutationBlindness
    - MutationEnhancedPerception
