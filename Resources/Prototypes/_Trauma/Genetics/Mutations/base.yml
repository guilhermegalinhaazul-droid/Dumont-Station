- type: entity
  abstract: true
  id: BaseMutation
  components:
  - type: Mutation

- type: entity
  abstract: true
  parent: BaseMutation
  id: BaseFreeMutation
  components:
  - type: Mutation
    instability: 0

# Trigger-only imported Trauma mutations are kept as catalog entries here.
# Their trigger/effect components are disabled because this fork does not include
# the corresponding Trauma trigger component set.
- type: entity
  abstract: true
  parent: BaseMutation
  id: BaseTriggerMutation

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseMutationAction
  components:
  - type: Action
    itemIconStyle: BigAction
    raiseOnAction: true
