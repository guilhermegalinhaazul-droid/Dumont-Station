# Private gun entities keep the two genetic abilities from sharing ammo
# providers when both genes are active on the same character.
- type: entity
  id: GeneticLaserEyesGun
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: Gun
    fireRate: 0.4
    useKey: false
    clumsyProof: true
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: HitscanBatteryAmmoProvider
    proto: RedLightLaser
    fireCost: 50
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50

- type: entity
  id: GeneticAcidSpitGun
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: Gun
    fireRate: 0.5
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    # Reuse the Xenomorph acid spit sound instead of the generic spray effect.
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg
  - type: RechargeBasicEntityAmmo
    # Keep the gun's internal recharge in sync with the action cooldown.
    rechargeCooldown: 5
    # Do not use RechargeBasicEntityAmmo's default forcewall/magic sound.
    # The shot itself supplies the acid-spit sound below.
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: BulletAcid
    capacity: 1
    count: 1

