- type: entity
  parent: BaseItem
  id: HandTelekinesisGun
  name: hand
  description: ""
  components:
  - type: Sprite
    sprite: /Textures/_Wega/Objects/Weapons/Melee/magic_hand.rsi
    state: icon
    color: "#ed760e"
  - type: Unremoveable
    deleteOnDrop: true
  - type: Item
    size: Ginormous
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#ed760e"
      right:
      - state: inhand-right
        color: "#ed760e"
  - type: TetherGun
    frequency: 5
    dampingRatio: 4
  - type: EdibleMatter
    canBeEaten: false
  - type: ItemToggle
    onUse: false

- type: entity
  parent: HandTelekinesisGun
  id: HandSuperTelekinesisGun
  name: super telekinetic hand
  components:
  - type: Sprite
    color: "#48a9ff"
  - type: Item
    # The hand is represented by the slot icon itself. Do not add an
    # additional in-hand overlay to the player's wrist/fist.
    inhandVisuals:
      left: []
      right: []
  - type: TetherGun
    canTetherAlive: true
    # Living targets are heavier than loose objects. Increase the joint force
    # and responsiveness so they can be moved without dragging behind.
    maxForce: 5000
    frequency: 20
    dampingRatio: 1.0
    lineColor: "#48a9ff"
  - type: SuperTelekinesisTargeting
